# ==============================================================================
# AviGest S.L. — Configuració Broker MQTT Mosquitto 2.0 (srv-serveis)
# ==============================================================================
# Laboratori: MQTT en clar al port 1883 dins de la LAN / túnel WireGuard.
# El xifratge d'enllaç el dona la VPN (fw-seu); no s'exposa 8883 sense certificats.
listener 1883 0.0.0.0
allow_anonymous true

# Persistència de missatges
persistence true
persistence_location /mosquitto/data/

# Registre de logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
