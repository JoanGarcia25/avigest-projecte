# ==============================================================================
# AviGest S.L. — Configuració Broker MQTT Mosquitto 2.0 (srv-serveis)
# ==============================================================================
listener 1883 0.0.0.0
allow_anonymous true

# Persistència de missatges
persistence true
persistence_location /mosquitto/data/

# Registre de logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
