services:
  # ============================================================================
  # 1. Base de Dades Central — PostgreSQL 16 LTS (Requeriment 4.3)
  # Allotjada a srv-serveis (LAN seu: 10.0.20.10)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: avigest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avigest_db
      POSTGRES_USER: avigest_app
      POSTGRES_PASSWORD: avigest_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - avigest_internal

  # ============================================================================
  # 2. Rèplica de la Base de Dades — PostgreSQL 16 Replica (Requeriment 4.6)
  # Simulació de rèplica en contenidor dins de srv-serveis per al laboratori.
  # Nota de disseny: Si cau la VM sencer, la redundància s'assumeix amb srv-backup.
  # ============================================================================
  postgres_replica:
    image: postgres:16-alpine
    container_name: avigest_postgres_replica
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: avigest_db
      POSTGRES_USER: avigest_app
      POSTGRES_PASSWORD: avigest_secret_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - avigest_internal

  # ============================================================================
  # 3. Broker de Missatgeria IoT — Eclipse Mosquitto (MQTT)
  # Rep lectures de granja1-srv que arriben a través de fw-seu (VPN)
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: avigest_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - avigest_internal

  # ============================================================================
  # 4. Servidor de Directori Centralitzat — OpenLDAP (Requeriment 4.2)
  # Autentica usuaris de la seu i de les granges remotes
  # ============================================================================
  openldap:
    image: osixia/openldap:1.5.0
    container_name: avigest_openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "AviGest S.L."
      LDAP_DOMAIN: "avigest.cat"
      LDAP_ADMIN_PASSWORD: "admin_ldap_pass_2026"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ../infra/ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    networks:
      - avigest_internal

  # ============================================================================
  # 5. Eina de Gestió Visual LDAP — phpLDAPadmin
  # Accés administratiu intern: http://localhost:8081
  # ============================================================================
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: avigest_phpldapadmin
    restart: unless-stopped
    depends_on:
      - openldap
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    networks:
      - avigest_internal

volumes:
  postgres_data:
    name: avigest_postgres_data
  postgres_replica_data:
    name: avigest_postgres_replica_data
  mosquitto_data:
    name: avigest_mosquitto_data
  mosquitto_log:
    name: avigest_mosquitto_log
  ldap_data:
    name: avigest_ldap_data
  ldap_config:
    name: avigest_ldap_config

networks:
  avigest_internal:
    name: avigest_network
    driver: bridge
