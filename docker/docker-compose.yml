services:
  # ============================================================================
  # 1. Base de Dades Central — MariaDB 10.11 LTS (Requeriment 4.3)
  # Allotjada a srv-serveis (LAN seu: 10.0.20.10)
  # ============================================================================
  mariadb:
    image: mariadb:10.11
    container_name: avigest_mariadb
    restart: unless-stopped
    command:
      - "mariadbd"
      - "--server-id=1"
      - "--log-bin=mariadb-bin"
      - "--binlog-format=ROW"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MARIADB_ROOT_PASSWORD: root_secret_2026
      MARIADB_DATABASE: avigest_db
      MARIADB_USER: avigest_app
      MARIADB_PASSWORD: avigest_secret_2026
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_2026", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - avigest_internal

  # ============================================================================
  # 2. Rèplica MariaDB Hot Standby — Replicació GTID (Requeriment 4.6)
  # Allotjada a srv-serveis en port alternatiu 3307
  # ============================================================================
  mariadb_replica:
    image: mariadb:10.11
    container_name: avigest_mariadb_replica
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: root_secret_2026
      PRIMARY_HOST: mariadb
      PRIMARY_PORT: 3306
      REPL_USER: replicator
      REPL_PASSWORD: replicator_pass_2026
    ports:
      - "3307:3306"
    volumes:
      - mariadb_replica_data:/var/lib/mysql
      - ./mariadb/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    networks:
      - avigest_internal

  # ============================================================================
  # 3. Broker de Missatgeria IoT — Eclipse Mosquitto (MQTT)
  # El trànsit de granja ja va xifrat per WireGuard; a laboratori s'usa 1883.
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: avigest_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - avigest_internal

  # ============================================================================
  # 3b. Ingesta MQTT → MariaDB (el broker sol no persisteix lectures)
  # ============================================================================
  mqtt_ingest:
    build:
      context: ../iot/ingestio
      dockerfile: Dockerfile
    container_name: avigest_mqtt_ingest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: avigest_iot
      DB_PASSWORD: iot_ingest_pass_2026
      DB_NAME: avigest_db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    networks:
      - avigest_internal

  # ============================================================================
  # 4. Servidor de Directori Centralitzat — OpenLDAP (Requeriment 4.2)
  # ============================================================================
  openldap:
    image: osixia/openldap:1.5.0
    container_name: avigest_openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "AviGest S.L."
      LDAP_DOMAIN: "avigest.cat"
      LDAP_ADMIN_PASSWORD: "admin_ldap_pass_2026"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ../infra/ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    networks:
      - avigest_internal

  # ============================================================================
  # 5. Eina de Gestió Visual LDAP — phpLDAPadmin
  # ============================================================================
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: avigest_phpldapadmin
    restart: unless-stopped
    depends_on:
      - openldap
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    networks:
      - avigest_internal

volumes:
  mariadb_data:
    name: avigest_mariadb_data
  mariadb_replica_data:
    name: avigest_mariadb_replica_data
  mosquitto_data:
    name: avigest_mosquitto_data
  mosquitto_log:
    name: avigest_mosquitto_log
  ldap_data:
    name: avigest_ldap_data
  ldap_config:
    name: avigest_ldap_config

networks:
  avigest_internal:
    name: avigest_network
    driver: bridge
