services:
  # ============================================================================
  # 1. Base de Dades Central — PostgreSQL 16 LTS (Requeriment 4.3)
  # Allotjada a srv-serveis (LAN seu: 10.0.20.10)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: avigest_postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=5"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "hot_standby=on"
    environment:
      POSTGRES_DB: avigest_db
      POSTGRES_USER: avigest_app
      POSTGRES_PASSWORD: avigest_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avigest_app -d avigest_db && psql -U avigest_app -d avigest_db -tAc \"SELECT 1 FROM pg_views WHERE viewname='v_panell_executiu_global'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - avigest_internal

  # ============================================================================
  # 2. Rèplica Hot Standby — streaming replication real (Requeriment 4.6)
  # Mateixa VM de laboratori: protegeix el procés PostgreSQL, no el disc de la VM.
  # ============================================================================
  postgres_replica:
    image: postgres:16-alpine
    container_name: avigest_postgres_replica
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: avigest_db
      POSTGRES_USER: avigest_app
      POSTGRES_PASSWORD: avigest_secret_2026
      PRIMARY_HOST: postgres
      REPL_USER: replicator
      REPL_PASSWORD: replicator_pass_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    networks:
      - avigest_internal

  # ============================================================================
  # 3. Broker de Missatgeria IoT — Eclipse Mosquitto (MQTT)
  # El trànsit de granja ja va xifrat per WireGuard; a laboratori s'usa 1883.
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: avigest_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - avigest_internal

  # ============================================================================
  # 3b. Ingesta MQTT → PostgreSQL (el broker sol no persisteix lectures)
  # ============================================================================
  mqtt_ingest:
    build:
      context: ../iot/ingestio
      dockerfile: Dockerfile
    container_name: avigest_mqtt_ingest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: avigest_iot
      PGPASSWORD: iot_ingest_pass_2026
      PGDATABASE: avigest_db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    networks:
      - avigest_internal

  # ============================================================================
  # 4. Servidor de Directori Centralitzat — OpenLDAP (Requeriment 4.2)
  # ============================================================================
  openldap:
    image: osixia/openldap:1.5.0
    container_name: avigest_openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "AviGest S.L."
      LDAP_DOMAIN: "avigest.cat"
      LDAP_ADMIN_PASSWORD: "admin_ldap_pass_2026"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ../infra/ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    networks:
      - avigest_internal

  # ============================================================================
  # 5. Eina de Gestió Visual LDAP — phpLDAPadmin
  # ============================================================================
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: avigest_phpldapadmin
    restart: unless-stopped
    depends_on:
      - openldap
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    networks:
      - avigest_internal

volumes:
  postgres_data:
    name: avigest_postgres_data
  postgres_replica_data:
    name: avigest_postgres_replica_data
  mosquitto_data:
    name: avigest_mosquitto_data
  mosquitto_log:
    name: avigest_mosquitto_log
  ldap_data:
    name: avigest_ldap_data
  ldap_config:
    name: avigest_ldap_config

networks:
  avigest_internal:
    name: avigest_network
    driver: bridge
